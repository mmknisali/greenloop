<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GreenLoop - Giriş Yap</title>
  <link rel="stylesheet" href="assets/css/shared.css?v=16" />
  <link rel="stylesheet" href="assets/css/login.css?v=16" />
</head>
<body>
<a class="skip-link" href="#main-content">İçeriğe geç</a>
<span id="main-content" tabindex="-1"></span>

<div class="page">
  <div class="left">
    <div data-nav="login"></div>
    <h2>Atık Ağına<br><em>Hoş Geldiniz</em></h2>
    <p>Şirketinizin atık verilerini platforma ekleyin, potansiyel hammadde ortaklarıyla eşleşin ve karbon ayak izinizi azaltın.</p>
    <div class="feature-list" id="feature-list"></div>
  </div>
  <div class="right">
    <div class="form-box">
      <div class="auth-tabs" role="tablist" aria-label="Hesap işlemleri">
        <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form" onclick="switchTab('login')">Giriş Yap</button>
        <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="register-form" tabindex="-1" onclick="switchTab('register')">Hesap Oluştur</button>
      </div>
      <div id="login-form" role="tabpanel" aria-labelledby="tab-login">
        <div class="form-title">Tekrar hoş geldiniz</div>
        <div class="form-sub">Hesabınıza giriş yapın</div>
        <div class="form-error" id="login-err" role="alert"></div>
        <div class="field"><label for="l-email">E-posta</label><input id="l-email" type="email" autocomplete="username" placeholder="ornek@sirket.com"/></div>
        <div class="field"><label for="l-pass">Şifre</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••"/></div>
        <button class="submit-btn" id="btn-login" onclick="doLogin()">Giriş Yap</button>
      </div>
      <div id="register-form" role="tabpanel" aria-labelledby="tab-register" style="display:none;">
        <div class="form-title">Hesap Oluştur</div>
        <div class="form-sub">Şirketiniz için bir hesap açın</div>
        <div class="form-error" id="reg-err" role="alert"></div>
        <div class="form-row">
          <div class="field"><label for="r-ad">Ad</label><input id="r-ad" type="text" autocomplete="given-name" placeholder="Ahmet"/></div>
          <div class="field"><label for="r-soyad">Soyad</label><input id="r-soyad" type="text" autocomplete="family-name" placeholder="Yılmaz"/></div>
        </div>
        <div class="field"><label for="r-email">E-posta</label><input id="r-email" type="email" autocomplete="username" placeholder="ornek@sirket.com"/></div>
        <div class="field"><label for="r-tel">Telefon</label><input id="r-tel" type="tel" autocomplete="tel" placeholder="05XX XXX XX XX"/></div>
        <div class="field"><label for="r-pass">Şifre</label><input id="r-pass" type="password" autocomplete="new-password" placeholder="En az 6 karakter"/></div>
        <div class="field"><label for="r-pass2">Şifre Tekrar</label><input id="r-pass2" type="password" autocomplete="new-password" placeholder="••••••••"/></div>
        <button class="submit-btn" id="btn-register" onclick="doRegister()">Hesap Oluştur</button>
      </div>
    </div>
  </div>
</div>
<script src="icons.js?v=16"></script>
<script src="api.js?v=16"></script>
<script src="assets/js/nav.js?v=16"></script>
<script src="assets/js/login.js?v=16"></script>
</body>
</html>
